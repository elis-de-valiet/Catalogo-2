<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS - Panel de Control</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { font-size: 18px; border-bottom: 2px solid #3498db; padding-bottom: 5px; color: #2c3e50; margin-top: 20px; }
        .nav-links { display: flex; justify-content: space-between; margin-bottom: 15px; background: #eaeaea; padding: 8px; border-radius: 6px; }
        .nav-links a { text-decoration: none; color: #2980b9; font-weight: bold; font-size: 14px; }
        .section { background: #fafafa; border: 1px solid #e0e0e0; padding: 12px; border-radius: 8px; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        input[type="text"], input[type="number"], input[type="date"] { width: 100%; padding: 10px; border: 2px solid #bdc3c7; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .btn { padding: 11px 15px; border: none; color: white; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-blue { background-color: #3498db; }
        .btn-red { background-color: #e74c3c; }
        .total-box { background: #27ae60; color: white; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 16px; font-weight: bold; }
        .total-box div { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .historial-item { background: #f9f9f9; border: 1px solid #ddd; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-links">
        <a href="index.html">🏢 ➔ Volver a la Caja de Cobro</a>
        <span>📍 Pantalla: Gestión</span>
    </div>

    <!-- REGISTRO -->
    <h2>📦 Registrar Producto Nuevo</h2>
    <div class="section">
        <div class="grid-inputs">
            <input type="text" id="inv-codigo" placeholder="Código de barras">
            <input type="text" id="inv-nombre" placeholder="Nombre">
        </div>
        <div class="grid-inputs">
            <input type="number" id="inv-compra" placeholder="Costo Compra ($)" step="0.01">
            <input type="number" id="inv-venta" placeholder="Precio Venta ($)" step="0.01">
        </div>
        <button class="btn btn-blue" onclick="guardarEnInventario()">💾 Guardar Producto</button>
    </div>

    <!-- REPORTE DIARIO -->
    <h2>📊 Cierre de Caja e Historial</h2>
    <div style="margin-bottom: 12px;">
        <input type="date" id="fecha-filtro" onchange="cargarHistorialDiario()" style="width: auto; display: inline-block;">
    </div>
    
    <div id="historial-contenedor"></div>

    <div class="total-box">
        <div><span>Ingreso Total Ventas:</span> <span id="resumen-venta-dia">$0.00</span></div>
        <div><span>Ganancia Neta Limpia:</span> <span id="resumen-ganancia-dia">$0.00</span></div>
    </div>
    
    <button class="btn btn-red" onclick="borrarTodo()" style="margin-top: 40px; font-size: 11px; padding: 6px;">⚠️ Resetear / Borrar Base de Datos</button>
</div>

<script>
    let inventario = JSON.parse(localStorage.getItem('pos_inventario')) || {};
    let historialVentas = JSON.parse(localStorage.getItem('pos_historial')) || [];

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('fecha-filtro').value = new Date().toISOString().split('T')[0];
        cargarHistorialDiario();
    });

    function guardarEnInventario() {
        const codigo = document.getElementById('inv-codigo').value.trim();
        const nombre = document.getElementById('inv-nombre').value.trim();
        const compra = parseFloat(document.getElementById('inv-compra').value);
        const venta = parseFloat(document.getElementById('inv-venta').value);

        if (!codigo || !nombre || isNaN(compra) || isNaN(venta)) return alert("Completa todos los campos.");

        inventario[codigo] = { nombre, compra, venta };
        localStorage.setItem('pos_inventario', JSON.stringify(inventario));
        
        document.getElementById('inv-codigo').value = ""; document.getElementById('inv-nombre').value = "";
        document.getElementById('inv-compra').value = ""; document.getElementById('inv-venta').value = "";
        alert(`✅ "${nombre}" añadido.`);
    }

    function cargarHistorialDiario() {
        const fechaSel = document.getElementById('fecha-filtro').value;
        const contenedor = document.getElementById('historial-contenedor');
        contenedor.innerHTML = "";

        let ventaHoy = 0, gananciaHoy = 0;
        const filtradas = historialVentas.filter(v => v.fecha === fechaSel);

        if (filtradas.length === 0) {
            contenedor.innerHTML = "<p style='color:#777; font-style:italic;'>No hay ventas este día.</p>";
        } else {
            filtradas.forEach((v, i) => {
                ventaHoy += v.total; gananciaHoy += v.ganancia;
                let txtItems = v.items.map(it => `${it.cantidad}x ${it.nombre}`).join(', ');
                contenedor.innerHTML += `
                    <div class="historial-item">
                        <strong>Venta #${i + 1} (${v.hora})</strong><br>
                        <span>${txtItems}</span><br>
                        <b>Total: $${v.total.toFixed(2)}</b> | <span style="color:#27ae60; font-weight:bold;">Ganancia: $${v.ganancia.toFixed(2)}</span>
                    </div>`;
            });
        }
        document.getElementById('resumen-venta-dia').innerText = `$${ventaHoy.toFixed(2)}`;
        document.getElementById('resumen-ganancia-dia').innerText = `$${gananciaHoy.toFixed(2)}`;
    }

    function borrarTodo() {
        if (confirm("¿Borrar permanentemente todos tus productos guardados y reportes?")) {
            localStorage.clear(); location.reload();
        }
    }
</script>
</body>
</html>
