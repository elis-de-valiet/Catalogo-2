<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Web Móvil - GitHub Ready</title>
    <!-- Usamos la versión limpia y directa de la librería -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f4f6f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 12px 15px;
            border: none;
            background-color: #3498db;
            color: white;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-camera { background-color: #2ecc71; }
        .btn-stop { background-color: #e74c3c; display: none; }
        #reader {
            width: 100%;
            max-width: 350px;
            margin: 0 auto 15px auto;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            background: #000;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        th { background-color: #f8f9fa; }
        .total-section {
            text-align: right;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛒 POS Escáner Móvil</h1>

    <div class="input-group">
        <input type="text" id="barcode-input" placeholder="Lector físico o código manual..." autofocus>
        <button class="btn-camera" id="btn-start" onclick="encenderCamara()">📷 Cámara</button>
        <button class="btn-stop" id="btn-stop" onclick="apagarCamara()">🛑 Apagar</button>
    </div>

    <!-- Contenedor del video de la cámara -->
    <div id="reader"></div>

    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Precio</th>
                <th>Cant.</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody id="cart-table-body"></tbody>
    </table>

    <div class="total-section">
        Total: $<span id="cart-total">0.00</span>
    </div>
</div>

<script>
    // Base de datos de prueba
    const infoProductos = {
        "123456": { nombre: "Producto Prueba", precio: 10.00 },
        "7501055310014": { nombre: "Refresco", precio: 1.50 }
    };

    let carrito = {};
    let html5QrCode = null; // Guardará la instancia de la cámara

    // Escuchar lector de código de barras físico
    document.getElementById('barcode-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            buscarYAgregar(this.value);
        }
    });

    function buscarYAgregar(codigo) {
        codigo = codigo.trim();
        if (!codigo) return;

        document.getElementById('barcode-input').value = "";
        
        if (infoProductos[codigo]) {
            const producto = infoProductos[codigo];
            if (carrito[codigo]) {
                carrito[codigo].cantidad += 1;
            } else {
                carrito[codigo] = { nombre: producto.nombre, precio: producto.precio, cantidad: 1 };
            }
            actualizarInterfaz();
            
            // Vibración corta en el celular al escanear con éxito
            if (navigator.vibrate) navigator.vibrate(80);
        } else {
            alert(`Código no encontrado: ${codigo}`);
        }
    }

    function actualizarInterfaz() {
        const tbody = document.getElementById('cart-table-body');
        const totalSpan = document.getElementById('cart-total');
        tbody.innerHTML = "";
        let granTotal = 0;

        for (let codigo in carrito) {
            const item = carrito[codigo];
            const subtotal = item.precio * item.cantidad;
            granTotal += subtotal;

            tbody.innerHTML += `
                <tr>
                    <td>${item.nombre}</td>
                    <td>$${item.precio.toFixed(2)}</td>
                    <td>${item.cantidad}</td>
                    <td>$${subtotal.toFixed(2)}</td>
                </tr>
            `;
        }
        totalSpan.innerText = granTotal.toFixed(2);
    }

    // --- LÓGICA DE LA CÁMARA PARA GITHUB PAGES ---
    function encenderCamara() {
        const readerDiv = document.getElementById('reader');
        readerDiv.style.display = 'block';
        
        // Creamos la instancia apuntando al div "reader"
        html5QrCode = new Html5Qrcode("reader");
        
        const config = { 
            fps: 10, 
            qrbox: { width: 250, height: 150 } // Cuadro de enfoque para barras
        };

        // Iniciamos la cámara forzando la cámara TRASERA (environment)
        html5QrCode.start(
            { facingMode: "environment" }, 
            config,
            (decodedText) => {
                // Si lee un código, lo agrega
                buscarYAgregar(decodedText);
            },
            (errorMessage) => {
                // Errores de escaneo silenciosos mientras busca
            }
        )
        .then(() => {
            // Cambiar botones si la cámara encendió con éxito
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('btn-stop').style.display = 'inline-block';
        })
        .catch((err) => {
            console.error("Error al iniciar cámara: ", err);
            alert("Error: Asegúrate de dar permisos de cámara y que estás usando HTTPS en GitHub.");
        });
    }

    function apagarCamara() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display = 'none';
                document.getElementById('btn-start').style.display = 'inline-block';
                document.getElementById('btn-stop').style.display = 'none';
                html5QrCode = null;
            }).catch(err => console.error("Error al apagar:", err));
        }
    }
</script>

</body>
</html>
